[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tbd-server"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.128.0",
  "uvicorn==0.39.0",
  "pydantic==2.12.5",
  "psycopg[binary]==3.3.2",
  "supabase==2.33.0",
  "httpx==0.28.1",
]

[project.scripts]
tbd-user = "tbd_server.cli:main"

[dependency-groups]
dev = ["pytest==8.0.0", "ruff==0.14.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
